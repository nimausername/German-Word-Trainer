name: Feature request
description: Suggest an improvement or new capability
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is hard or missing today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What would you like the app to do?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Other approaches you considered, if any.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Study / SM-2
        - Word catalog
        - Auth / Keycloak
        - UI
        - API
        - Docs / DX
        - Other
    validations:
      required: true
