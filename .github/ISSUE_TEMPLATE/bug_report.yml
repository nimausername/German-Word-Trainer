name: Bug report
description: Something is not working as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report a bug. Please fill in every section you can.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What went wrong?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Numbered steps that another person can follow.
      placeholder: |
        1. Sign in
        2. Open /study
        3. …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Where did this happen?
      options:
        - Local development
        - Docker / Coolify / production
        - Unsure
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Commit or version
      description: Git SHA or tag, if you know it.
  - type: textarea
    id: extra
    attributes:
      label: Extra context
      description: Logs, screenshots, or related issues. Do not paste secrets.
